name: Build and test Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: windows_v11_build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: python -m pip install --upgrade pip ezdxf cryptography pyinstaller

      - name: Source self-test
        run: python self_test.py

      - name: Build standalone EXE
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name "Soundvision to DXF converter"
          --icon icon.ico
          --hidden-import cryptography
          --collect-all ezdxf
          windows_app.py

      - name: Test the built EXE itself
        shell: pwsh
        run: |
          & ".\dist\Soundvision to DXF converter.exe" --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload tested Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Soundvision-to-DXF-converter-Windows-v11
          path: windows_v11_build/dist/Soundvision to DXF converter.exe
